[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-pencil"
version = "0.1.0"
description = "Locate, forecast and repair multilingual safety drift with a gauge-invariant curvature lens (Lexsi hackathon, Track 2b)"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7",
  "transformers>=5.15,<5.22",
  "peft",
  "safetensors",
  "numpy",
  "scipy",
  "pyyaml",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["verification", "third_party", "outputs"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplifications
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E731",   # small named lambdas are fine in tests
  "E741",   # maths names (l, I) follow the paper
  "B905",   # zip() without strict= is used on equal-length sequences throughout
  "SIM300", # flags `S == pytest.approx(...)` and `S < S_before` (it takes capitalised maths names for constants)
]

[tool.ruff.lint.isort]
known-first-party = ["pencil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: builds and runs a tiny random Cohere2 model (seconds, CPU)",
  "needs_lexsi: needs the patched Lexsi libraries from scripts/setup_lexsi.sh",
]
